MODEL:
  NAME: "deeplab_resnet101"
  WEIGHTS: 'pretrain/resnet101-5d3b4d8f.pth'
  FREEZE_BN: True
  UNCERTAINTY: 0.5
  POS: [ 0,1,2,3,4,5 ]
  NUM_CLASSES: 6
DATASETS:
  #SOURCE_TRAIN: "POT_train"
  SOURCE_TRAIN: "VAI_train"
  TEST: "VAI_train"
INPUT:
  INPUT_SIZE_TEST: (512, 512)
  BRIGHTNESS: 0.5
  CONTRAST: 0.5
  SATURATION: 0.5
  HUE: 0.1
SOLVER:
  BASE_LR: 5e-4
  MAX_ITER: 31250
  STOP_ITER: 20000
  BATCH_SIZE: 2
  CHECKPOINT_PERIOD: 2500

