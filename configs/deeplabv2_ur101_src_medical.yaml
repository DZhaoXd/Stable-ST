MODEL:
  NAME: "deeplab_resnet101"
  WEIGHTS: 'pretrain/resnet101-5d3b4d8f.pth'
  FREEZE_BN: True
  UNCERTAINTY: 0.5
  POS: [ 0,1,2,3,4,5 ]
  NUM_CLASSES: 2
DATASETS:
  #SOURCE_TRAIN: "EndoScene_train"
  TEST: "Etislarib_train"
  SOURCE_TRAIN: "Etislarib_train"
  #TEST: "EndoScene_train"
INPUT:
  INPUT_SIZE_TEST: (256, 256)
  BRIGHTNESS: 0.0
  CONTRAST: 0.0
  SATURATION: 0.0
  HUE: 0.0
SOLVER:
  BASE_LR: 5e-4
  MAX_ITER: 31250
  STOP_ITER: 10000
  BATCH_SIZE: 4

